# Generates MarginPhone.xcodeproj:  brew install xcodegen && xcodegen  (run inside iOS/)
name: MarginPhone
options:
  bundleIdPrefix: com.ltshahak
  deploymentTarget:
    iOS: "26.0"
packages:
  argmax:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    from: 1.1.0
targets:
  MarginPhone:
    type: application
    platform: iOS
    sources:
      - path: MarginPhone
      - path: ../Sources/MarginKit
        group: MarginKit
      - path: Assets.xcassets
    dependencies:
      - package: argmax
        product: WhisperKit
      - package: argmax
        product: SpeakerKit
    settings:
      base:
        PRODUCT_NAME: Margin
        PRODUCT_BUNDLE_IDENTIFIER: com.ltshahak.margin.phone
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MarginPhone/Info.plist
      properties:
        CFBundleDisplayName: Margin
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Margin records your classes and transcribes them on your iPhone. Audio never leaves your devices except through your own iCloud Drive.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, com.apple.m4a-audio, public.mpeg-4-audio, public.mp3, com.microsoft.waveform-audio]
