name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/MarginKit/**"
      - "iOS/**"
      - ".github/workflows/iphone-ipa.yml"

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned IPA
        run: iOS/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Margin-ipa
          path: build/Margin.ipa
          retention-days: 30

  screenshots:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Simulator screenshots
        run: iOS/screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-screenshots
          path: build/shots
          retention-days: 14
